<div class="form-wrapper">

  <div class="form-card">
    <h2 class="titulo">Registrar Alumno</h2>

    <form class="form-grid">

      <!-- DATOS DEL ALUMNO -->
      <div class="section">
        <h3>Datos del Alumno</h3>

        <div class="grid-2">
          <input [(ngModel)]="alumno.dni" name="dni" placeholder="DNI" maxlength="9" required>
          <input [(ngModel)]="alumno.nombres" name="nombres" placeholder="Nombres" required>
          <input [(ngModel)]="alumno.apellidos" name="apellidos" placeholder="Apellidos" required>
        </div>

        <div class="grid-2">

          <!-- NIVEL -->
          <div>
            <label>Nivel</label>
            <select
              [(ngModel)]="alumno.nivel.id"
              name="nivel"
              (ngModelChange)="actualizarGradosPorNivel()"
              required
            >
              <option [ngValue]="null" disabled>Seleccione nivel</option>
              <option *ngFor="let n of niveles" [ngValue]="n.id">
                {{ n.nombre }}
              </option>
            </select>
          </div>

          <!-- GRADO -->
          <div>
            <label>Grado</label>
            <select [(ngModel)]="alumno.grado" name="grado" required>
              <option value="" disabled>Seleccione grado</option>
              <option *ngFor="let g of gradosDisponibles" [value]="g">
                {{ g }}
              </option>
            </select>
          </div>

          <!-- SECCIÓN -->
          <div>
            <label>Sección</label>
            <select [(ngModel)]="alumno.seccion" name="seccion" required>
              <option value="" disabled>Seleccione sección</option>
              <option *ngFor="let s of secciones" [value]="s">
                {{ s }}
              </option>
            </select>
          </div>

        </div>
      </div>

      <!-- DATOS PADRE -->
      <div class="section">
        <h3>Datos del Padre / Madre</h3>

        <div class="grid-2">
          <input [(ngModel)]="alumno.padres[0].dni" name="dniPadre" placeholder="DNI Padre" maxlength="8" required>
          <input [(ngModel)]="alumno.padres[0].nombres" name="nombrePadre" placeholder="Nombres Padre" required>
          <input [(ngModel)]="alumno.padres[0].apellidos" name="apellidoPadre" placeholder="Apellidos Padre" required>
          <input [(ngModel)]="alumno.padres[0].telefono" name="telefonoPadre" placeholder="Teléfono Padre" maxlength="9" required>
        </div>
      </div>

      <button type="button" class="btn-guardar" (click)="guardar()">
        Guardar y Generar QR
      </button>
    </form>
  </div>

  <!-- Vista previa del QR -->
  <div class="qr-card" *ngIf="alumno.dni && !mostrarQrFinal">
    <h3>Vista previa del QR</h3>

    <qrcode
      [qrdata]="qrData"
      [width]="200"
      [errorCorrectionLevel]="'M'">
    </qrcode>
  </div>

  <!-- QR final -->
  <div class="qr-card qr-final" *ngIf="mostrarQrFinal">
    <h3>QR generado correctamente</h3>

    <p><strong>Alumno:</strong> {{ alumnoRegistrado?.nombres }} {{ alumnoRegistrado?.apellidos }}</p>
    <p><strong>DNI:</strong> {{ alumnoRegistrado?.dni }}</p>
    <p><strong>Grado:</strong> {{ alumnoRegistrado?.grado }}</p>
    <p><strong>Sección:</strong> {{ alumnoRegistrado?.seccion }}</p>

    <div id="zona-imprimir" class="pdf-qr-content">
      <qrcode
        [qrdata]="qrGenerado"
        [width]="220"
        [errorCorrectionLevel]="'M'">
      </qrcode>
    </div>

    <div class="acciones-qr">
      <button type="button" class="btn-guardar" (click)="descargarQrPdf()">
        Descargar PDF
      </button>

      <button type="button" class="btn-secundario" (click)="imprimirQr()">
        Imprimir
      </button>

      <button type="button" class="btn-limpiar" (click)="limpiarFormulario()">
        Nuevo registro
      </button>
    </div>
  </div>

</div>
